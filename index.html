<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{color-scheme:light}</style>
<title>Funduino Cube Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: links der Cube von oben mit Reglern für die Sensoren, rechts die Arduino-IDE, Lernhilfen als Schublade */
:root {
  --bg: #e8eeec; --panel: #ffffff; --panel2: #f2f6f5; --ink: #14201e; --muted: #53655f; --line: #cbd7d4;
  --accent: #00838c; --accent-ink: #ffffff; --accent-soft: #d5eceb; --bar: #00777f; --bar-ink: #ffffff;
  --ok: #1b7f45; --warn: #a45f00; --bad: #c03a32; --pcb: #0f2a33; --pcb-edge: #1f4a58; --silk: #a8cfd0;
  --code-bg: #fbfdfc; --code-ink: #16231f; --kw: #00747c; --fn: #87490a; --cn: #6a3fa0; --num: #a1336a; --str: #2a7539; --cm: #6f827d;
  --gutter: #edf3f1; --gutter-ink: #7f9690; --sel: rgba(0, 131, 140, .22); --shadow: 0 10px 30px rgba(10, 30, 28, .18);
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1211; --panel: #131c1b; --panel2: #1a2625; --ink: #e3eeea; --muted: #8ea49e; --line: #283a3a;
  --accent: #38c2cb; --accent-ink: #04201f; --accent-soft: #163a3c; --bar: #0f5c63; --bar-ink: #f1fbfa;
  --ok: #5cc888; --warn: #e0a248; --bad: #ff7d72; --pcb: #0a2027; --pcb-edge: #1d4955; --silk: #8fbfc1;
  --code-bg: #0b1110; --code-ink: #d9e8e4; --kw: #52cfd6; --fn: #f0b15c; --cn: #c3a2f0; --num: #f08db9; --str: #8fd39a; --cm: #6a827c;
  --gutter: #0f1817; --gutter-ink: #556e68; --sel: rgba(56, 194, 203, .28); --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1211; --panel: #131c1b; --panel2: #1a2625; --ink: #e3eeea; --muted: #8ea49e; --line: #283a3a;
  --accent: #38c2cb; --accent-ink: #04201f; --accent-soft: #163a3c; --bar: #0f5c63; --bar-ink: #f1fbfa;
  --ok: #5cc888; --warn: #e0a248; --bad: #ff7d72; --pcb: #0a2027; --pcb-edge: #1d4955; --silk: #8fbfc1;
  --code-bg: #0b1110; --code-ink: #d9e8e4; --kw: #52cfd6; --fn: #f0b15c; --cn: #c3a2f0; --num: #f08db9; --str: #8fd39a; --cm: #6a827c;
  --gutter: #0f1817; --gutter-ink: #556e68; --sel: rgba(56, 194, 203, .28); --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.top { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { width: 38px; height: 38px; flex: none; }
.brand h1 { margin: 0; font-size: 20px; line-height: 1.15; letter-spacing: -.01em; text-wrap: balance; }
.brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
.top-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; font-weight: 600; }
.chip:hover, .chip[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); }
.speed { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
.speed select { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 8px; }

.stage { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 6fr); gap: 14px; align-items: start; }
@media (max-width: 980px) { .stage { grid-template-columns: minmax(0, 1fr); } }
@media (min-width: 1500px) { body.drawer-open { padding-right: 460px; } }
.cube-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.board-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
#board { display: block; width: 100%; height: auto; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
#board text { font-family: var(--ui); }
.env { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; }
@media (max-width: 520px) { .env { grid-template-columns: minmax(0, 1fr); } }
.env h2 { grid-column: 1 / -1; margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ctl { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ctl label, .ctl .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }
.ctl output { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); margin: 2px 0; }
.ctl .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn2 { border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 6px 12px; font-weight: 600; touch-action: none; user-select: none; }
.btn2:hover, .btn2.on { background: var(--accent-soft); border-color: var(--accent); }
.ctl .chk { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }

/* IDE */
.ide { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); display: flex; flex-direction: column; min-width: 0; box-shadow: 0 1px 0 var(--line); }
.ide-bar { background: var(--bar); color: var(--bar-ink); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; }
.tb { display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, .12); color: inherit; border: 1px solid rgba(255, 255, 255, .22);
  border-radius: 8px; padding: 5px 10px; font-weight: 600; font-size: 13px; }
.tb:hover { background: rgba(255, 255, 255, .24); }
.tb svg { width: 16px; height: 16px; flex: none; }
.tb[disabled] { opacity: .5; cursor: default; }
.ide-bar select { background: rgba(255, 255, 255, .12); color: inherit; border: 1px solid rgba(255, 255, 255, .22); border-radius: 8px; padding: 5px 8px; max-width: 200px; }
.ide-bar select option { color: #111; }
.ide-bar .sp { flex: 1; }
.ide-tab { background: var(--panel2); border-bottom: 1px solid var(--line); padding: 0 8px; display: flex; }
.ide-tab span { padding: 6px 12px; border: 1px solid var(--line); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--code-bg); font: 12.5px var(--mono); margin-top: 4px; }
.editor { position: relative; height: clamp(300px, 46vh, 540px); background: var(--code-bg); display: flex; }
.gutter { flex: none; width: 44px; background: var(--gutter); color: var(--gutter-ink); font: 13px/20px var(--mono); text-align: right; padding: 10px 8px 40px 0; overflow: hidden; user-select: none; }
.gutter div { height: 20px; }
.gutter .err { color: #fff; background: var(--bad); }
.code-area { position: relative; flex: 1; min-width: 0; }
#hl, #code { position: absolute; inset: 0; margin: 0; padding: 10px 12px 40px; border: 0; font: 13px/20px var(--mono); tab-size: 2; white-space: pre; overflow: auto; letter-spacing: 0; }
#hl { pointer-events: none; color: var(--code-ink); overflow: hidden; }
#code { background: transparent; color: transparent; caret-color: var(--code-ink); resize: none; outline: none; }
#code::selection { background: var(--sel); color: transparent; }
.k { color: var(--kw); font-weight: 600; } .f { color: var(--fn); } .c { color: var(--cn); } .n { color: var(--num); } .s { color: var(--str); } .m { color: var(--cm); font-style: italic; } .p { color: var(--cm); }
.status { display: flex; justify-content: space-between; gap: 10px; padding: 4px 12px; background: var(--bar); color: var(--bar-ink); font-size: 12px; }
.bottom { border-top: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); background: var(--panel2); padding: 4px 6px 0; flex-wrap: wrap; }
.tab { border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 6px 12px; border-radius: 8px 8px 0 0; font-weight: 600; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--panel); border-color: var(--line); color: var(--ink); }
.pane { height: 190px; overflow: auto; padding: 8px 12px; background: var(--panel); }
.pane[hidden] { display: none; }
.log { font: 12.5px/1.5 var(--mono); display: flex; flex-direction: column; gap: 4px; }
.log div { padding-left: 8px; border-left: 3px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
.log .error { border-color: var(--bad); color: var(--bad); } .log .hint { border-color: var(--accent); } .log .tip { border-color: var(--warn); background: var(--panel2); } .log .ok { border-color: var(--ok); color: var(--ok); }
.log .hint::before { content: "Tipp: "; font-weight: 700; color: var(--accent); } .log .tip::before { content: "Hilfe: "; font-weight: 700; color: var(--warn); }
.mon { display: flex; flex-direction: column; height: 100%; gap: 6px; }
.mon pre { flex: 1; margin: 0; overflow: auto; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-height: 0; }
.mon .bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.mon input[type=text] { flex: 1; min-width: 120px; border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 5px 8px; }
.mon select, .mon .btn2 { padding: 5px 8px; border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; }

/* Schublade: Lernpfad, Spickzettel, Frage */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(450px, 100%); background: var(--panel); border-left: 1px solid var(--line);
  box-shadow: var(--shadow); display: flex; flex-direction: column; z-index: 20; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 0 10px; gap: 8px; }
.drawer-head .tabs { flex: 1; border-bottom: 0; background: transparent; padding: 0; }
.drawer-body { flex: 1; overflow: auto; padding: 14px 16px 24px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.drawer-body[hidden] { display: none; }
.drawer h2 { margin: 0; font-size: 17px; text-wrap: balance; } .drawer h3 { margin: 0; font-size: 14px; } .drawer p { margin: 0; }
.x { border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; width: 32px; height: 32px; font-size: 18px; line-height: 1; }
.lessons { display: flex; flex-direction: column; gap: 6px; padding: 0; margin: 0; list-style: none; }
.lessons button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 8px 10px; }
.lessons button:hover { border-color: var(--accent); }
.lessons .nr { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); font-weight: 700; flex: none; font-size: 12px; }
.lessons .done .nr { background: var(--ok); color: #fff; }
.lessons small { display: block; color: var(--muted); }
.lesson-box { display: flex; flex-direction: column; gap: 10px; }
.tag { display: inline-block; font: 12px var(--mono); background: var(--accent-soft); border-radius: 6px; padding: 1px 6px; }
.pins { display: flex; flex-wrap: wrap; gap: 6px; }
.task { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); }
.task .box { width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 6px; flex: none; margin-top: 1px; display: grid; place-items: center; font-size: 13px; line-height: 1; }
.task.ok { border-color: var(--ok); } .task.ok .box { background: var(--ok); border-color: var(--ok); color: #fff; }
.hintbox { border-left: 3px solid var(--warn); background: var(--panel2); padding: 8px 10px; border-radius: 0 8px 8px 0; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 6px 12px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:hover { filter: brightness(1.08); }
.quiz .opt { display: block; width: 100%; text-align: left; margin-top: 6px; border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 7px 10px; }
.quiz .opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--panel)); }
.quiz .opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--panel)); }
pre.snip { margin: 0; padding: 8px 10px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; font: 12.5px/1.5 var(--mono); overflow-x: auto; white-space: pre; }
.cmd { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; background: var(--panel2); }
.cmd code { font: 12.5px var(--mono); color: var(--kw); font-weight: 600; }
.decide { border: 1px solid var(--accent); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--accent-soft); }
.decide fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.decide legend { font-weight: 700; padding: 0; margin-bottom: 2px; }
.decide label { display: flex; gap: 8px; align-items: center; }
.result { background: var(--panel); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.chat { display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 92%; padding: 8px 11px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--accent-soft); border-color: var(--accent); }
.msg code { font: 12.5px var(--mono); background: var(--code-bg); padding: 0 4px; border-radius: 4px; }
.askbar { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.askbar textarea { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 7px 9px; }
.askbar[hidden] { display: none; }
.note { color: var(--muted); font-size: 12.5px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="3" width="34" height="34" rx="8" fill="var(--pcb)"/><circle cx="13" cy="13" r="3.4" fill="#ff5a4d"/><circle cx="13" cy="21" r="3.4" fill="#ffd23f"/><circle cx="13" cy="29" r="3.4" fill="#3ddc84"/><rect x="21" y="10" width="10" height="20" rx="2" fill="#2d7fb8"/></svg>
      <div><h1>Funduino Cube</h1><p>Simulator und Lernumgebung für den Arduino Nano</p></div>
    </div>
    <nav class="top-actions" aria-label="Hilfen">
      <button class="chip" id="btnLern" aria-expanded="false" aria-controls="drawer">Lernpfad</button>
      <button class="chip" id="btnSpick" aria-expanded="false" aria-controls="drawer">Spickzettel</button>
      <label class="speed">Tempo
        <select id="speed" aria-label="Simulationstempo"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="5">5×</option><option value="10">10×</option></select>
      </label>
    </nav>
  </header>

  <main class="stage">
    <section class="cube-col" aria-label="Funduino Cube">
      <div class="board-wrap"><svg id="board" viewBox="0 0 1810 1240" role="img" aria-label="Der Funduino Cube von oben mit LEDs, Taster, Bewegungsmelder, Lautsprecher, Ultraschall, LED-Ring, Servo, Infrarot, Fotowiderstand, Potentiometer, OLED, DHT11 und Beschleunigungssensor"></svg></div>
      <div class="env" id="env" aria-label="Umgebung und Sensoren"></div>
    </section>

    <section class="ide" aria-label="Programmierumgebung">
      <div class="ide-bar">
        <button class="tb" id="btnCheck" title="Programm auf Fehler prüfen"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg>Überprüfen</button>
        <button class="tb" id="btnRun" title="Programm auf den Cube laden und starten"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8h10M8.5 3.5L13 8l-4.5 4.5"/></svg>Hochladen</button>
        <button class="tb" id="btnStop" title="Programm anhalten und Cube zurücksetzen"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg>Stopp</button>
        <select id="examples" aria-label="Beispiel laden"></select>
        <span class="sp"></span>
        <button class="tb" id="btnTipp" title="Hilfe zu deinem Programm"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5.5 11.5h5M6.2 14h3.6M8 1.8a4.2 4.2 0 0 0-2.4 7.6c.5.4.9 1 .9 1.6h3c0-.6.4-1.2.9-1.6A4.2 4.2 0 0 0 8 1.8z"/></svg>Tipp</button>
        <button class="tb" id="btnMon" title="Serieller Monitor öffnen"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6.8" cy="6.8" r="4.3"/><path d="M10 10l4 4"/></svg>Serieller Monitor</button>
      </div>
      <div class="ide-tab"><span>sketch_cube.ino</span></div>
      <div class="editor">
        <div class="gutter" id="gutter" aria-hidden="true"></div>
        <div class="code-area">
          <pre id="hl" aria-hidden="true"></pre>
          <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Programmcode"></textarea>
        </div>
      </div>
      <div class="status"><span id="status">Arduino Nano · ATmega328P</span><span id="pos">Zeile 1, Spalte 1</span></div>
      <div class="bottom">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tabOut" aria-selected="true">Ausgabe</button>
          <button class="tab" role="tab" id="tabMon" aria-selected="false">Serieller Monitor</button>
        </div>
        <div class="pane" id="paneOut" role="tabpanel"><div class="log" id="log"></div></div>
        <div class="pane" id="paneMon" role="tabpanel" hidden>
          <div class="mon">
            <pre id="monOut" aria-live="off"></pre>
            <div class="bar">
              <input type="text" id="monIn" placeholder="Text an den Cube senden" aria-label="Text senden">
              <button class="btn2" id="monSend">Senden</button>
              <select id="baud" aria-label="Baudrate"><option>300</option><option>1200</option><option>2400</option><option>4800</option><option selected>9600</option><option>19200</option><option>38400</option><option>57600</option><option>115200</option></select>
              <button class="btn2" id="monClear">Löschen</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <aside class="drawer" id="drawer" hidden aria-label="Lernhilfen">
    <div class="drawer-head">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="dtLern" aria-selected="true">Lernpfad</button>
        <button class="tab" role="tab" id="dtSpick" aria-selected="false">Spickzettel</button>
      </div>
      <button class="x" id="dClose" aria-label="Schublade schließen">×</button>
    </div>
    <div class="drawer-body" id="dbLern" role="tabpanel"></div>
    <div class="drawer-body" id="dbSpick" role="tabpanel" hidden></div>
  </aside>
</div>
<script>
/* sim-core.js: Hardwaremodell und Arduino-Funktionen des Funduino Cube
   Pinbelegung nach funduino-cube.de (Nano R3):
   D2 IR · D3 Servo · D4 LED-Ring · D5 Echo · D6 Trigger · D7 Lautsprecher · D8 PIR · D9 Taster
   D10 grün · D11 gelb · D12 rot · A3 DHT11 · A6 Poti · A7 Fotowiderstand */
var CUBE = (function () {
  'use strict';
  const ABORT = { abort: true };
  const PWM = [3, 5, 6, 9, 10, 11];
  const PIN = { ir: 2, servo: 3, ring: 4, echo: 5, trig: 6, speaker: 7, pir: 8, button: 9,

    audio(); for (const f of frameHooks) f(t);
    requestAnimationFrame(frame);
  }
  function init() { build(); buildEnv(); $('envPot').value = S.env.pot; $('envLight').value = S.env.light; $('envDist').value = S.env.dist; $('envTemp').value = S.env.temp; $('envHum').value = S.env.hum; requestAnimationFrame(frame); }
  return { init, unlockAudio, onFrame: f => frameHooks.push(f), $ };
})();

/* coach.js: statische Hinweise zum Programmtext und Entscheidungshilfe */
var COACH = (function () {
  'use strict';
  function consts(src) {
    const m = {}; let r;
    const a = /(?:const\s+)?(?:int|byte|long|unsigned\s+int|uint8_t)\s+(\w+)\s*=\s*(\d+)\s*;/g; while ((r = a.exec(src))) m[r[1]] = Number(r[2]);
    const b = /^\s*#define\s+(\w+)\s+(\d+)\s*$/gm; while ((r = b.exec(src))) m[r[1]] = Number(r[2]);
    return m;
  }
  function pinOf(t, c) { t = t.trim(); if (/^\d+$/.test(t)) return Number(t); if (/^A[0-7]$/.test(t)) return 14 + Number(t[1]); return t in c ? c[t] : null; }
  const pn = p => (p >= 14 ? 'A' + (p - 14) : String(p));
  function analyze(src0) {
    const src = src0.replace(/\/\/[^\n]*/g, '').replace(/\/\*[\s\S]*?\*\//g, ''), c = consts(src), out = [], add = s => { if (!out.includes(s)) out.push(s); };
    const outP = new Set(), inP = new Set(), pwmP = new Set(); let r;
    const pm = /pinMode\s*\(\s*([\w]+)\s*,\s*(OUTPUT|INPUT_PULLUP|INPUT)\s*\)/g;
    while ((r = pm.exec(src))) { const p = pinOf(r[1], c); if (p === null) continue; (r[2] === 'OUTPUT' ? outP : inP).add(p); }
    const aw = /analogWrite\s*\(\s*([\w]+)\s*,/g; while ((r = aw.exec(src))) { const p = pinOf(r[1], c); if (p !== null) pwmP.add(p); }
    const dw = /digitalWrite\s*\(\s*([\w]+)\s*,/g;
    while ((r = dw.exec(src))) { const p = pinOf(r[1], c); if (p !== null && !outP.has(p) && !pwmP.has(p)) add(`In digitalWrite benutzt du Pin ${pn(p)}, aber in setup() fehlt pinMode(${r[1]}, OUTPUT); Ohne diese Zeile bleibt der Pin ein Eingang und die LED leuchtet höchstens schwach.`); }
    const dr = /digitalRead\s*\(\s*([\w]+)\s*\)/g;
    while ((r = dr.exec(src))) { const p = pinOf(r[1], c); if (p !== null && outP.has(p)) add(`Pin ${pn(p)} ist mit pinMode als OUTPUT eingestellt, du liest ihn aber mit digitalRead. Zum Einlesen braucht der Pin INPUT.`); }
    if (/\bif\s*\(\s*[A-Za-z_]\w*\s*=\s*[^=]/.test(src)) add('In einer if-Bedingung steht ein einzelnes =. Das speichert einen Wert. Zum Vergleichen brauchst du zwei Gleichheitszeichen: ==');
    if (/Serial\s*\.\s*print/.test(src) && !/Serial\s*\.\s*begin/.test(src)) add('Du benutzt Serial.print, aber Serial.begin(9600); fehlt in setup().');
    if (/digitalWrite\s*\([^)]*HIGH/.test(src) && /digitalWrite\s*\([^)]*LOW/.test(src) && !/delay|millis|digitalRead|analogRead|pulseIn|Serial\s*\.\s*read/.test(src))
      add('In deinem Programm fehlt ein delay(). Ohne Pause wechselt die LED so schnell, dass du nur ein Dauerleuchten siehst.');
    return out;
  }
  const DECIDE = {
    'out-digital': { fn: 'digitalWrite(pin, HIGH oder LOW)', why: 'Ausgang, nur an oder aus: z. B. LED, Lautsprecher-Pin. Der Nano gibt etwas aus, also pinMode(pin, OUTPUT).',
      cube: 'Am Cube: rote LED D12, gelbe LED D11, grüne LED D10', snip: 'pinMode(12, OUTPUT);      // einmal in setup()\ndigitalWrite(12, HIGH);   // an (LOW = aus)\n' },
    'out-analog': { fn: 'analogWrite(pin, 0 bis 255)', why: 'Ausgang, stufenlos (PWM): zum Dimmen. 0 ist aus, 255 ist voll an. Geht nur an Pins mit ~ : 3, 5, 6, 9, 10, 11.',
      cube: 'Am Cube: grüne LED D10 und gelbe LED D11 können dimmen, die rote D12 nicht', snip: 'analogWrite(10, 128);   // halbe Helligkeit\n' },
    'in-digital': { fn: 'digitalRead(pin)', why: 'Eingang, nur zwei Zustände: HIGH (an) oder LOW (aus). Der Nano liest etwas ein, also pinMode(pin, INPUT).',
      cube: 'Am Cube: Taster D9, Bewegungsmelder D8', snip: 'pinMode(9, INPUT);          // einmal in setup()\nint status = digitalRead(9);   // HIGH oder LOW\n' },
    'in-analog': { fn: 'analogRead(pin)', why: 'Eingang, stufenlos: liefert 0 bis 1023 (0 V bis 5 V). Nur an den Pins A0 bis A7. Ein pinMode ist nicht nötig.',
      cube: 'Am Cube: Potentiometer A6, Fotowiderstand A7', snip: 'int wert = analogRead(A6);   // 0 bis 1023\n' }
  };
  const PINS = [['D2', 'Infrarot-Empfänger', 'Eingang digital'], ['D3', 'Servomotor (PWM)', 'Ausgang'], ['D4', 'LED-Ring (12 Pixel)', 'Ausgang, eigene Bibliothek'],
    ['D5', 'Ultraschall Echo', 'Eingang digital'], ['D6', 'Ultraschall Trigger', 'Ausgang digital'], ['D7', 'Lautsprecher', 'Ausgang, tone()'], ['D8', 'Bewegungsmelder', 'Eingang digital'],
    ['D9', 'Taster', 'Eingang digital'], ['D10', 'LED grün (PWM)', 'Ausgang digital oder analog'], ['D11', 'LED gelb (PWM)', 'Ausgang digital oder analog'], ['D12', 'LED rot', 'Ausgang digital'],
    ['A3', 'DHT11 Temperatur und Feuchte', 'Bibliothek DHT'], ['A6', 'Potentiometer', 'Eingang analog'], ['A7', 'Fotowiderstand', 'Eingang analog'], ['A0 bis A2', 'Beschleunigungssensor ADXL335 (x, y, z)', 'Eingang analog'], ['A4/A5', 'OLED (I²C)', 'folgt']];
  const CMDS = [
    ['pinMode(pin, OUTPUT)', 'Legt fest, ob ein Pin etwas ausgibt (OUTPUT) oder einliest (INPUT). Steht in setup().'],
    ['digitalWrite(pin, HIGH)', 'Schaltet einen Ausgang an (HIGH) oder aus (LOW).'],
    ['digitalRead(pin)', 'Liest einen Eingang als HIGH oder LOW.'],
    ['analogRead(A6)', 'Liest eine Spannung stufenlos als Zahl von 0 bis 1023.'],
    ['analogWrite(pin, 0…255)', 'Gibt stufenlos aus (dimmen). Nur an Pins mit ~ .'],
    ['delay(1000)', 'Wartet in Millisekunden. 1000 sind eine Sekunde.'],
    ['Serial.begin(9600);  Serial.println(x);', 'Schreibt Werte in den Seriellen Monitor. Begin steht in setup().'],
    ['tone(7, 440);  noTone(7);', 'Spielt einen Ton mit 440 Hertz am Lautsprecher und beendet ihn.'],
    ['map(x, 0, 1023, 0, 255)', 'Rechnet einen Wertebereich in einen anderen um.'],
    ['if (a == b) { … } else { … }', 'Entscheidung. Vergleichen mit ==, nicht mit einem einzelnen =.']
  ];
  return { analyze, DECIDE, PINS, CMDS };
})();

/* ide.js: Editor, Werkzeugleiste, Ausgabe und Serieller Monitor */
var IDE = (function () {
  'use strict';
  const $ = CUBEUI.$, S = CUBE.S, names = CUBE.apiNames();
  const code = $('code'), hl = $('hl'), gutter = $('gutter');
  let lastCompile = null, prevCode = null, monBaud = 9600, seenLog = -1, seenSer = -1;
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

  /* ---------- Syntaxfarben ---------- */
  const KW = new Set('void int long short float double bool boolean byte char word unsigned signed const static volatile String if else for while do switch case default break continue return true false size_t uint8_t uint16_t uint32_t'.split(' '));
  const CN = new Set('HIGH LOW INPUT OUTPUT INPUT_PULLUP LED_BUILTIN A0 A1 A2 A3 A4 A5 A6 A7 PI NEO_GRB NEO_KHZ800 DHT11 DEC HEX BIN'.split(' '));
  const FN = new Set('pinMode digitalWrite digitalRead analogRead analogWrite delay delayMicroseconds millis micros tone noTone pulseIn map constrain min max abs random sqrt pow sin cos tan Serial Servo DHT Adafruit_NeoPixel setup loop attach write begin print println show setPixelColor Color readTemperature readHumidity clear setBrightness available read detach fill numPixels'.split(' '));
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const RE = /(\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|$))|("(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|(^[ \t]*#[^\n]*)|(\b0[xX][0-9a-fA-F]+\b|\b\d+\.?\d*(?:[eE][+-]?\d+)?[uUlLfF]*\b)|([A-Za-z_]\w*)/gm;
  function highlight(src) {
    let o = '', i = 0, m; RE.lastIndex = 0;
    while ((m = RE.exec(src))) {
      o += esc(src.slice(i, m.index)); i = RE.lastIndex; const t = m[0];
      if (m[1]) o += '<span class="m">' + esc(t) + '</span>';
      else if (m[2]) o += '<span class="s">' + esc(t) + '</span>';
      else if (m[3]) o += '<span class="p">' + esc(t) + '</span>';
      else if (m[4]) o += '<span class="n">' + esc(t) + '</span>';
      else if (KW.has(t)) o += '<span class="k">' + t + '</span>';
      else if (CN.has(t)) o += '<span class="c">' + t + '</span>';
      else if (FN.has(t)) o += '<span class="f">' + t + '</span>';
      else o += t;
    }
    return o + esc(src.slice(i)) + '\n';
  }
  let errLines = new Set();
  function paint() {
    hl.innerHTML = highlight(code.value);
    const n = code.value.split('\n').length; let g = '';
    for (let i = 1; i <= n; i++) g += `<div${errLines.has(i) ? ' class="err"' : ''}>${i}</div>`;
    gutter.innerHTML = g; sync();
  }
  function sync() { hl.scrollTop = code.scrollTop; hl.scrollLeft = code.scrollLeft; gutter.scrollTop = code.scrollTop; }
  function updatePos() { const s = code.selectionStart, v = code.value.slice(0, s), l = v.split('\n'); $('pos').textContent = `Zeile ${l.length}, Spalte ${l[l.length - 1].length + 1}`; }
  let saveT = null;
  function onInput() { lastCompile = null; errLines = new Set(); paint(); updatePos(); clearTimeout(saveT); saveT = setTimeout(() => store.set('fcube.code', code.value), 500); }
  code.addEventListener('input', onInput); code.addEventListener('scroll', sync);
  ['keyup', 'click', 'select'].forEach(n => code.addEventListener(n, updatePos));
  let tabFree = false;
  code.addEventListener('keydown', e => {
    if (e.key === 'Escape') { tabFree = true; return; }
    if (e.key === 'Tab' && !tabFree) { e.preventDefault(); ins('  '); return; } if (e.key !== 'Tab') tabFree = false;
    if (e.key === 'Enter' && !e.isComposing && !e.ctrlKey && !e.metaKey) {
      const v = code.value, s = code.selectionStart, ls = v.lastIndexOf('\n', s - 1) + 1, ind = /^[ \t]*/.exec(v.slice(ls, s))[0];
      let add = '\n' + ind, back = 0; if (v[s - 1] === '{') { add += '  '; if (v[s] === '}') { back = ind.length + 1; add += '\n' + ind; } }
      e.preventDefault(); ins(add); if (back) { const p = code.selectionStart - back; code.setSelectionRange(p, p); }
    }
  });
  function ins(t) { code.focus(); if (!document.execCommand || !document.execCommand('insertText', false, t)) { code.setRangeText(t, code.selectionStart, code.selectionEnd, 'end'); onInput(); } }

  /* ---------- Meldungen ---------- */
  function renderLog() {
    if (seenLog === S.logVer) return; seenLog = S.logVer; const box = $('log'); box.textContent = '';
    for (const l of S.log) { const d = document.createElement('div'); d.className = l.sev; d.textContent = l.text;
      if (l.undo && prevCode !== null) { const b = document.createElement('button'); b.className = 'btn2'; b.textContent = 'Rückgängig'; b.style.marginLeft = '8px';
        b.onclick = () => { setCode(prevCode); CUBE.clearLog(); }; d.appendChild(b); }
      box.appendChild(d); }
    $('paneOut').scrollTop = $('paneOut').scrollHeight;
  }
  function status(t) { $('status').textContent = t; }
  function renderSerial() {
    if (seenSer === S.serialVer) return; seenSer = S.serialVer; const pre = $('monOut');
    const near = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40; let s = '';
    for (const c of S.serial.chunks) s += c.baud === monBaud ? c.s : c.s.replace(/[^\s]/g, (m, i) => '▯#%&@?'[(m.charCodeAt(0) + i) % 6]);
    if (s.length > 20000) s = s.slice(-20000); pre.textContent = s; if (near) pre.scrollTop = pre.scrollHeight;
  }
  function tab(which) {
    const mon = which === 'mon'; $('tabOut').setAttribute('aria-selected', !mon); $('tabMon').setAttribute('aria-selected', mon);
    $('paneOut').hidden = mon; $('paneMon').hidden = !mon; if (mon) { seenSer = -1; renderSerial(); }
  }
  $('tabOut').onclick = () => tab('out'); $('tabMon').onclick = () => tab('mon'); $('btnMon').onclick = () => tab('mon');
  $('baud').onchange = e => { monBaud = Number(e.target.value); seenSer = -1; };
  $('monClear').onclick = () => CUBE.clearSerial();
  const send = () => { const i = $('monIn'); if (!S.running) return; CUBE.sendSerial(i.value + '\n'); i.value = ''; };
  $('monSend').onclick = send; $('monIn').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

  /* ---------- Überprüfen, Hochladen, Stopp ---------- */
  function check() {
    CUBE.clearLog(); errLines = new Set(); const src = code.value;
    const r = TRANSPILE.compile(src, names); lastCompile = r;
    if (!r.ok) { CUBE.log('error', (r.line ? 'Zeile ' + r.line + ': ' : '') + r.msg); if (r.line) errLines.add(r.line); paint(); status('Fehler beim Überprüfen'); tab('out'); return null; }
    CUBE.log('ok', 'Überprüfen: keine Fehler gefunden.');
    if (window.COACH) COACH.analyze(src).forEach(w => CUBE.log('hint', w));
    paint(); status('Überprüft, keine Fehler'); return r;
  }
  function run() {
    CUBEUI.unlockAudio(); const r = check(); if (!r) return;
    CUBE.run(r); status('Hochgeladen, das Programm läuft'); if (window.LEARN) LEARN.onRun();
  }
  function stop() { CUBE.reset(); status('Angehalten, der Cube ist zurückgesetzt'); }
  $('btnCheck').onclick = check; $('btnRun').onclick = run; $('btnStop').onclick = stop;
  $('speed').onchange = e => CUBE.setSpeed(Number(e.target.value));
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); } });

  /* ---------- Code laden ---------- */
  function setCode(src) { code.value = src; errLines = new Set(); paint(); updatePos(); store.set('fcube.code', src); }
  function loadCode(src, title) {
    prevCode = code.value; setCode(src); CUBE.clearLog();
    S.log.push({ sev: 'info', text: (title ? '„' + title + '“ geladen. ' : 'Programm geladen. '), undo: true }); S.logVer++; tab('out'); status('Neues Programm im Editor');
  }
  const sel = $('examples'); sel.innerHTML = '<option value="">Beispiel laden …</option>' + EXAMPLES.map(e => `<option value="${e.id}">${esc(e.title)}</option>`).join('');
  sel.onchange = () => { const e = EXAMPLES.find(x => x.id === sel.value); sel.value = ''; if (e) loadCode(e.code, e.title); };
  $('btnTipp').onclick = () => { if (window.LEARN) { const t = LEARN.tipp(); CUBE.log('tip', t); tab('out'); } };

  function init() {
    const saved = store.get('fcube.code'); setCode(saved && saved.trim() ? saved : EXAMPLES.find(e => e.id === 'blink').code);
    CUBEUI.onFrame(() => { renderLog(); renderSerial(); });
  }
  return { init, run, check, stop, tab, loadCode, setCode, getCode: () => code.value, insert: t => ins(t), lastCompile: () => lastCompile, esc };
})();

/* learn.js: Schublade mit Lernpfad und Spickzettel, Tipps */

  const $ = CUBEUI.$, S = CUBE.S, esc = IDE.esc;
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

  const save = () => { store.set('fcube.done', JSON.stringify([...done])); store.set('fcube.quiz', JSON.stringify(quiz)); };

    } else {

      box.innerHTML = `<div class="lesson-box"><button class="btn ghost" data-act="back" style="align-self:flex-start">← Alle Lektionen</button>
        <h2>${esc(l.title)}</h2><div class="pins">${l.pins.map(p => `<span class="tag">${esc(p)}</span>`).join('')}</div>
        ${l.intro.map(p => `<p>${esc(p)}</p>`).join('')}
        ${ex ? `<button class="btn" data-act="example" data-id="${ex.id}" style="align-self:flex-start">Beispielprogramm in den Editor laden</button>` : ''}
        <h3>Aufgaben</h3>
        ${l.tasks.map((t, i) => { const k = key(l, i), ok = done.has(k), lv = hintLv[k] || 0;
          return `<div class="task ${ok ? 'ok' : ''}"><span class="box" ${t.test ? '' : `data-act="tick" data-k="${k}" role="checkbox" aria-checked="${ok}" tabindex="0" style="cursor:pointer"`}>${ok ? '✓' : ''}</span>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px"><span>${esc(t.t)}</span>
            ${t.test ? '<span class="note">Wird automatisch erkannt.</span>' : '<span class="note">Hake selbst ab, wenn du fertig bist.</span>'}
            ${lv ? t.hints.slice(0, lv).map((h, j) => j === 2 ? `<pre class="snip">${esc(h)}</pre>` : `<div class="hintbox">${esc(h)}</div>`).join('') : ''}
            ${ok || lv >= 3 ? '' : `<button class="btn ghost" data-act="hint" data-k="${k}" style="align-self:flex-start">${lv === 0 ? 'Tipp holen' : lv === 1 ? 'Noch ein Tipp' : 'Lösung zeigen'}</button>`}</div></div>`; }).join('')}
        <h3>Kurz nachgedacht</h3><div class="quiz"><p>${esc(q.q)}</p>
          ${q.o.map((o, i) => `<button class="opt ${qa === undefined ? '' : i === q.a ? 'right' : i === qa ? 'wrong' : ''}" data-act="quiz" data-i="${i}" ${qa === undefined ? '' : 'disabled'}>${esc(o)}</button>`).join('')}
          ${qa === undefined ? '' : `<p class="note" style="margin-top:8px">${qa === q.a ? 'Richtig. ' : 'Nicht ganz. '}${esc(q.why)}</p>`}</div></div>`;
    }
    box.scrollTop = top;
  }

  /* ---------- Spickzettel ---------- */
  function renderSpick() {
    const box = $('dbSpick'), d = decide, res = d.dir && d.kind ? COACH.DECIDE[d.dir + '-' + d.kind] : null;
    box.innerHTML = `<h2>Spickzettel</h2>
      <div class="decide"><h3>Welchen Befehl brauche ich?</h3>
        <fieldset><legend>Was soll der Nano tun?</legend>
          <label><input type="radio" name="dir" value="out" ${d.dir === 'out' ? 'checked' : ''}>etwas ausgeben (LED, Lautsprecher, Servo)</label>
          <label><input type="radio" name="dir" value="in" ${d.dir === 'in' ? 'checked' : ''}>etwas einlesen (Taster, Sensor)</label></fieldset>
        <fieldset><legend>Wie viele Stufen hat das Signal?</legend>
          <label><input type="radio" name="kind" value="digital" ${d.kind === 'digital' ? 'checked' : ''}>nur zwei: an oder aus (digital)</label>
          <label><input type="radio" name="kind" value="analog" ${d.kind === 'analog' ? 'checked' : ''}>viele Stufen (analog)</label></fieldset>
        ${res ? `<div class="result"><strong><code>${esc(res.fn)}</code></strong><span>${esc(res.why)}</span><span class="note">${esc(res.cube)}</span>
          <pre class="snip">${esc(res.snip)}</pre><button class="btn" data-act="insert" style="align-self:flex-start">In den Editor einfügen</button></div>` : '<p class="note">Wähle oben beide Antworten.</p>'}
      </div>
      <h3>Befehle</h3>${COACH.CMDS.map(c => `<div class="cmd"><code>${esc(c[0])}</code><span>${esc(c[1])}</span></div>`).join('')}
      <h3>Pinbelegung des Cube</h3>
      <div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:13px"><tbody>${COACH.PINS.map(p => `<tr><td style="padding:4px 8px 4px 0;font-family:var(--mono);font-weight:700">${p[0]}</td><td style="padding:4px 8px">${esc(p[1])}</td><td style="padding:4px 0;color:var(--muted)">${esc(p[2])}</td></tr>`).join('')}</tbody></table></div>
      <h3>Tastenkürzel</h3><p class="note">Strg + Enter lädt das Programm hoch. Die Tab-Taste rückt im Editor ein. Mit Esc und danach Tab verlässt du den Editor wieder.</p>`;
    box.querySelectorAll('input[type=radio]').forEach(r => r.addEventListener('change', () => { decide[r.name] = r.value; renderSpick(); }));
  }

  /* ---------- Klicks ---------- */
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || !$('drawer').contains(b)) return; const a = b.dataset.act;
    if (a === 'open') { cur = b.dataset.id; renderLern(); $('dbLern').scrollTop = 0; }
    else if (a === 'back') { cur = null; renderLern(); }
    else if (a === 'example') { const x = EXAMPLES.find(v => v.id === b.dataset.id); if (x) IDE.loadCode(x.code, x.title); }
    else if (a === 'hint') { hintLv[b.dataset.k] = Math.min(3, (hintLv[b.dataset.k] || 0) + 1); renderLern(); }
    else if (a === 'tick') { const k = b.dataset.k; done.has(k) ? done.delete(k) : done.add(k); save(); renderLern(); }
    else if (a === 'quiz') { quiz[cur] = Number(b.dataset.i); save(); renderLern(); }
    else if (a === 'insert') { const r = COACH.DECIDE[decide.dir + '-' + decide.kind]; if (r) { IDE.insert(r.snip); } }
  });
  document.addEventListener('keydown', e => { const b = e.target.closest && e.target.closest('[data-act=tick]'); if (b && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); b.click(); } });

  /* ---------- Schublade ---------- */
  function showTab(t) {
    tabNow = t; const tabs = { lern: ['dtLern', 'dbLern'], spick: ['dtSpick', 'dbSpick'], ask: ['dtAsk', 'dbAsk'] };
    for (const k in tabs) { const tb = $(tabs[k][0]), pn = $(tabs[k][1]); if (!tb) continue; tb.setAttribute('aria-selected', k === t); pn.hidden = k !== t; }
    if ($('askbar')) $('askbar').hidden = t !== 'ask';
    $('btnLern').setAttribute('aria-expanded', open() && t === 'lern'); $('btnSpick').setAttribute('aria-expanded', open() && t === 'spick');
    if ($('btnAsk')) $('btnAsk').setAttribute('aria-expanded', open() && t === 'ask');
    if (t === 'lern') renderLern(); else if (t === 'spick') renderSpick();
  }
  const open = () => !$('drawer').hidden;
  function openDrawer(t) { if (open() && tabNow === t) return closeDrawer(); $('drawer').hidden = false; document.body.classList.add('drawer-open'); showTab(t); }
  function closeDrawer() { $('drawer').hidden = true; document.body.classList.remove('drawer-open'); ['btnLern', 'btnSpick', 'btnAsk'].forEach(i => $(i) && $(i).setAttribute('aria-expanded', 'false')); }
  $('btnLern').onclick = () => openDrawer('lern'); $('btnSpick').onclick = () => openDrawer('spick'); $('dClose').onclick = closeDrawer;
  $('dtLern').onclick = () => showTab('lern'); $('dtSpick').onclick = () => showTab('spick'); if ($('dtAsk')) $('dtAsk').onclick = () => showTab('ask'); if ($('btnAsk')) $('btnAsk').onclick = () => openDrawer('ask');
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && open() && $('drawer').contains(document.activeElement)) closeDrawer(); });

  /* ---------- Aufgaben automatisch erkennen ---------- */
  let lastCheck = 0;
  CUBEUI.onFrame(t => {
    if (!S.running || t - lastCheck < 250) return; lastCheck = t; let changed = false;
    for (const l of LESSONS) l.tasks.forEach((tk, i) => { const k = key(l, i); if (tk.test && !done.has(k)) { let ok = false; try { ok = tk.test(); } catch (e) {}
      if (ok) { done.add(k); changed = true; CUBE.log('ok', `Aufgabe geschafft: ${tk.t}`); } } });
    if (changed) { save(); if (open() && tabNow === 'lern') renderLern(); }
  });

  /* ---------- Tipp-Knopf ---------- */
  function compileTip(r) {
    const m = r.msg, z = r.line ? ` Das Programm meldet Zeile ${r.line}.` : '';
    if (/Semikolon/.test(m)) return 'Jede Anweisung endet mit einem Semikolon ;' + z + ' Schau auch in die Zeile davor.';
    if (/Klammer|\)|\}/.test(m)) return 'Zähle die Klammern: Zu jedem { gehört ein }, zu jeder runden Klammer ( ein ).' + z + ' Der Editor rückt automatisch ein, daran erkennst du, wo etwas fehlt.';
    if (/setup|loop/.test(m)) return 'Jedes Arduino-Programm braucht void setup() { } und void loop() { }.';
    if (/include/.test(m)) return 'Bibliotheken wie Servo, DHT oder Adafruit_NeoPixel musst du ganz oben mit #include einbinden.';
    return 'Lies die Meldung in der Ausgabe genau.' + z + ' Prüfe dort Schreibweise, Klammern und Semikolon.';
  }
  function currentLesson() { return LESSONS.find(l => l.id === cur) || LESSONS.find(l => !lessonDone(l)) || null; }
  function tipp() {
    const lc = IDE.lastCompile(); if (lc && !lc.ok) return compileTip(lc);
    const rt = S.log.filter(l => l.sev === 'error' || l.sev === 'hint'); if (rt.length) return 'Lies zuerst diese Meldung: ' + rt[rt.length - 1].text;
    const l = currentLesson();
    if (l) { const i = l.tasks.findIndex((t, j) => !done.has(key(l, j)));
      if (i >= 0) { const k = key(l, i), lv = Math.min(3, (hintLv[k] || 0) + 1); hintLv[k] = lv; if (open() && tabNow === 'lern') renderLern();
        return `Lektion „${l.title}“, Aufgabe ${i + 1}: ${l.tasks[i].hints[lv - 1]}` + (lv < 3 ? '  (Klicke noch einmal auf Tipp für mehr Hilfe.)' : ''); } }
    return 'Beschreibe in einem Satz, was passieren soll. Frage dich dann: Gibt der Nano etwas aus oder liest er etwas ein? Gibt es nur an und aus oder viele Stufen? Der Spickzettel hilft dir bei der Wahl des Befehls.';
  }
  function init() { renderLern(); }
  return { init, tipp, onRun() { if (open() && tabNow === 'lern') renderLern(); }, openDrawer, showTab, state: () => ({ done, cur }) };
})();

/* boot.js: Start */
(function () {
  CUBEUI.init(); IDE.init(); LEARN.init();
  if (typeof ASK !== 'undefined') ASK.init();
  try { new Function('return 1')(); } catch (e) { CUBE.log('error', 'Diese Umgebung blockiert das Ausführen von Programmen (Sicherheitsrichtlinie). Öffne die HTML-Datei direkt im Browser.'); }
  CUBE.log('info', 'Im Editor steht ein Blink-Beispiel. Drücke oben auf „Hochladen“ und schau auf die rote LED. Hilfe findest du rechts oben unter Lernpfad und Spickzettel und mit dem Knopf Tipp.');
})();

</script>
</body>
</html>
